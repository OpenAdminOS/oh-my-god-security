# Pull request checks: formatting, lints, and tests on macOS, Linux and
# Windows, plus a lint of every workflow file. Every job installs the pinned
# Microsoft MXC executor so the sandbox tests run against the real backend.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # MXC's macOS executor needs macOS 15 or later on Apple Silicon.
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Allow user namespaces for MXC
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
          # the MXC bubblewrap backend needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install MXC executor (checksum verified)
        shell: bash
        env:
          MXC_VERSION: 1.0.1
          MXC_ZIP_SHA256: 0e832239454ba7fcd338ff56218a287eef4c0a01c1484084b869f55feff8abe9
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            macOS-ARM64) member=arm64/mxc-exec-mac ;;
            Linux-X64) member=x64/lxc-exec ;;
            Linux-ARM64) member=arm64/lxc-exec ;;
            Windows-X64) member=x64/wxc-exec.exe ;;
            Windows-ARM64) member=arm64/wxc-exec.exe ;;
            *) echo "no MXC executor for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          zip="$RUNNER_TEMP/mxc.zip"
          curl -fsSL -o "$zip" \
            "https://github.com/microsoft/mxc/releases/download/v${MXC_VERSION}/mxc-release-binaries.zip"
          if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          echo "${MXC_ZIP_SHA256}  $zip" | $sum -c -
          mkdir -p "$RUNNER_TEMP/mxc"
          unzip -j -o "$zip" "$member" -d "$RUNNER_TEMP/mxc"
          rm -f "$zip"
          exe="$RUNNER_TEMP/mxc/${member##*/}"
          chmod +x "$exe"
          # omgs checks the executor's own SHA-256 against its pin before use.
          echo "OMGS_MXC_EXEC=$exe" >> "$GITHUB_ENV"
      - name: Windows filesystem diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/windows-diagnostics.ps1
      - name: Doctor
        shell: bash
        run: cargo run --locked -q -- doctor --live
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
