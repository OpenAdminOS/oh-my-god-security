name: release

# Build, sign, and publish the per-platform omgs binaries that the skill's
# first-run bootstrap (skill/scripts/install.sh and install.ps1) downloads and
# verifies against SHA256SUMS. Triggered by pushing a version tag, for example
# `git tag v0.1.0 && git push origin v0.1.0`.
#
# Every build checks out the exact commit the tag resolves to (prepare job), so
# a manual run cannot attach binaries built from a different ref to the tag.
#
# Required secrets (same names as the proven TenuVault pipeline):
#   macOS: MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER
#   Windows (Azure Trusted Signing, app openadminos-signing):
#     AZURE_SIGNING_TENANT_ID, AZURE_SIGNING_CLIENT_ID, AZURE_SIGNING_CLIENT_SECRET,
#     AZURE_TRUSTED_SIGNING_ENDPOINT, AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
#     AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME, AZURE_TRUSTED_SIGNING_PUBLISHER_NAME

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Validate the tag is a semantic version (prerelease suffix allowed).
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a vMAJOR.MINOR.PATCH[-prerelease] tag"; exit 1
          fi
          # Resolve the tag to an immutable commit SHA; fails if the tag is absent.
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq '.sha')"
          if [ -z "$sha" ]; then echo "::error::tag $VERSION does not resolve to a commit"; exit 1; fi
          # A hyphen in the version marks a prerelease (v0.2.0-rc.1).
          case "$VERSION" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$VERSION"
            echo "sha=$sha"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"
          echo "resolved $VERSION -> $sha (prerelease=$pre)"

  macos:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both arches
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Sign and notarize
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for v in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v:-}" ]; then echo "::error::missing signing secret $v"; exit 1; fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpw="$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')"
          security create-keychain -p "$kpw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpw" "$keychain"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then echo "::error::no Developer ID Application identity in the imported cert"; exit 1; fi
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/api.p8"
          mkdir -p dist
          for pair in "aarch64-apple-darwin:omgs-aarch64-apple-darwin" "x86_64-apple-darwin:omgs-x86_64-apple-darwin"; do
            target="${pair%%:*}"; asset="${pair##*:}"
            bin="target/$target/release/omgs"
            codesign --force --timestamp --options runtime --keychain "$keychain" --sign "$identity" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
            ( cd "$(dirname "$bin")" && /usr/bin/ditto -c -k "omgs" "$RUNNER_TEMP/$asset.zip" )
            # Notarize and require an explicit Accepted verdict; --wait exit status
            # alone is not sufficient, so parse the JSON status.
            out="$(xcrun notarytool submit "$RUNNER_TEMP/$asset.zip" \
              --key "$RUNNER_TEMP/api.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --wait --output-format json)"
            echo "$out"
            status="$(printf '%s' "$out" | jq -r '.status // empty')"
            if [ "$status" != "Accepted" ]; then
              echo "::error::notarization not accepted for $asset (status='${status:-none}')"; exit 1
            fi
            cp "$bin" "dist/$asset"
          done
          security delete-keychain "$keychain" || true
          rm -f "$RUNNER_TEMP/api.p8" "$RUNNER_TEMP/cert.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/*

  linux:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: omgs-x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: omgs-aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - run: |
          set -euo pipefail
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/omgs" "dist/${{ matrix.asset }}"
          strip "dist/${{ matrix.asset }}" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/*

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-pc-windows-msvc
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/omgs.exe" "dist/omgs-x86_64-pc-windows-msvc.exe"
      - name: Sign with Azure Trusted Signing
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [prepare, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: staging
      - name: Guard against clobbering a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is already published; bump the version instead of re-signing"; exit 1
            fi
          fi
      - name: Assemble assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find staging -type f -name 'omgs-*' -exec cp {} release/ \;
          cd release
          # Every expected asset must be present before we publish; a missing
          # platform must fail, not ship a partial release.
          expected="omgs-aarch64-apple-darwin omgs-x86_64-apple-darwin omgs-x86_64-unknown-linux-gnu omgs-aarch64-unknown-linux-gnu omgs-x86_64-pc-windows-msvc.exe"
          for a in $expected; do
            if [ ! -f "$a" ]; then echo "::error::missing release asset $a"; exit 1; fi
          done
          sha256sum $expected > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            release/omgs-*
            release/SHA256SUMS
          fail_on_unmatched_files: true
