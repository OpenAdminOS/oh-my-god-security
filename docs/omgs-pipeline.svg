<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OMGS pipeline: red hunts, blue verifies, a separate evaluator adjudicates, green guards</title>
  <desc id="d">A left-to-right flow of four stages. Red hunters find candidate trust-boundary violations in isolation. An independent blue verifier tries to disprove each and makes survivors earn proof in an OS sandbox. A separate evaluator adjudicates every verdict. Green turns confirmed findings into fix briefs and regression tests.</desc>

  <defs>
    <linearGradient id="gRB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#5b9dff"/>
    </linearGradient>
    <linearGradient id="gBV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b9dff"/><stop offset="1" stop-color="#b69bff"/>
    </linearGradient>
    <linearGradient id="gVG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b69bff"/><stop offset="1" stop-color="#51d08a"/>
    </linearGradient>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="944" height="384" rx="18" fill="#0f1117" stroke="#20242e"/>

  <!-- header -->
  <text x="34" y="54" fill="#e7e9ee" font-size="26" font-weight="700" letter-spacing="0.5">OMGS</text>
  <text x="120" y="54" fill="#6b7280" font-size="15" font-weight="500">Oh My God Security</text>
  <text x="34" y="82" fill="#9aa0ad" font-size="15">Red hunts.&#160;&#160;Blue verifies.&#160;&#160;Green guards.&#160;&#160;Proof or it is not confirmed.</text>

  <!-- connectors (marching-ants flow + arrowheads) -->
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M232 214 H262" stroke="url(#gRB)" stroke-dasharray="7 7">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M472 214 H502" stroke="url(#gBV)" stroke-dasharray="7 7">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M712 214 H742" stroke="url(#gVG)" stroke-dasharray="7 7">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#9aa0ad">
    <polygon points="262,208 272,214 262,220"/>
    <polygon points="502,208 512,214 502,220"/>
    <polygon points="742,208 752,214 742,220"/>
  </g>

  <!-- stage 1: RED hunt -->
  <g>
    <rect x="28" y="150" width="196" height="128" rx="12" fill="#171a21" stroke="#272b35"/>
    <rect x="28" y="150" width="5" height="128" rx="2.5" fill="#ff6b6b"/>
    <rect x="28" y="150" width="196" height="128" rx="12" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.12;0.33;1" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="52" cy="176" r="5" fill="#ff6b6b"/>
    <text x="68" y="181" fill="#ff8a8a" font-size="12" font-weight="700" letter-spacing="1.2">RED &#183; HUNT</text>
    <text x="46" y="214" fill="#e7e9ee" font-size="16" font-weight="650">Isolated hunters</text>
    <text x="46" y="238" fill="#9aa0ad" font-size="12.5">One per trust boundary.</text>
    <text x="46" y="256" fill="#9aa0ad" font-size="12.5">Candidates, no severity.</text>
  </g>

  <!-- stage 2: BLUE verify -->
  <g>
    <rect x="268" y="150" width="196" height="128" rx="12" fill="#171a21" stroke="#272b35"/>
    <rect x="268" y="150" width="5" height="128" rx="2.5" fill="#5b9dff"/>
    <rect x="268" y="150" width="196" height="128" rx="12" fill="none" stroke="#5b9dff" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.12;0.33;1" dur="4.8s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="292" cy="176" r="5" fill="#5b9dff"/>
    <text x="308" y="181" fill="#8bb8ff" font-size="12" font-weight="700" letter-spacing="1.2">BLUE &#183; VERIFY</text>
    <text x="286" y="214" fill="#e7e9ee" font-size="16" font-weight="650">Independent proof</text>
    <text x="286" y="238" fill="#9aa0ad" font-size="12.5">Disprove each candidate.</text>
    <text x="286" y="256" fill="#9aa0ad" font-size="12.5">Survivors earn sandbox proof.</text>
  </g>

  <!-- stage 3: ADJUDICATE -->
  <g>
    <rect x="508" y="150" width="196" height="128" rx="12" fill="#171a21" stroke="#272b35"/>
    <rect x="508" y="150" width="5" height="128" rx="2.5" fill="#b69bff"/>
    <rect x="508" y="150" width="196" height="128" rx="12" fill="none" stroke="#b69bff" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.12;0.33;1" dur="4.8s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="532" cy="176" r="5" fill="#b69bff"/>
    <text x="548" y="181" fill="#c9b6ff" font-size="12" font-weight="700" letter-spacing="1.2">ADJUDICATE</text>
    <text x="526" y="214" fill="#e7e9ee" font-size="16" font-weight="650">Separate evaluator</text>
    <text x="526" y="238" fill="#9aa0ad" font-size="12.5">Upholds, adjusts, or</text>
    <text x="526" y="256" fill="#9aa0ad" font-size="12.5">overturns every verdict.</text>
  </g>

  <!-- stage 4: GREEN guard -->
  <g>
    <rect x="748" y="150" width="196" height="128" rx="12" fill="#171a21" stroke="#272b35"/>
    <rect x="748" y="150" width="5" height="128" rx="2.5" fill="#51d08a"/>
    <rect x="748" y="150" width="196" height="128" rx="12" fill="none" stroke="#51d08a" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.12;0.33;1" dur="4.8s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="772" cy="176" r="5" fill="#51d08a"/>
    <text x="788" y="181" fill="#79e0a8" font-size="12" font-weight="700" letter-spacing="1.2">GREEN &#183; GUARD</text>
    <text x="766" y="214" fill="#e7e9ee" font-size="16" font-weight="650">Fixed stays fixed</text>
    <text x="766" y="238" fill="#9aa0ad" font-size="12.5">Confirmed to fix briefs</text>
    <text x="766" y="256" fill="#9aa0ad" font-size="12.5">and regression tests.</text>
  </g>

  <!-- footer -->
  <text x="34" y="346" fill="#6b7280" font-size="12.5">Each stage runs in its own fresh context, so no agent certifies its own work.</text>
  <text x="34" y="366" fill="#6b7280" font-size="12.5">No cloud. No telemetry. Only test-proven or sandbox-exploited is confirmed; traced stays a candidate.</text>
</svg>
