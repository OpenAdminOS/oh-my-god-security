<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>OMGS pipeline live</title>
<style>
:root{color-scheme:light dark;--bg:#0e0e11;--surface:#17171b;--sunk:#1f1f25;--text:#ececef;--muted:#a0a0aa;--faint:#71717a;--line:#2a2a31;--red:#ff8a80;--amber:#f5c451;--green:#7ee0a0;--blue:#8fb4ff;--violet:#c3b2ff;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:22px 20px 60px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(126,224,160,.6);animation:pulse 1.8s infinite}
.dot.stale{background:var(--faint);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(126,224,160,.5)}70%{box-shadow:0 0 0 7px rgba(126,224,160,0)}100%{box-shadow:0 0 0 0 rgba(126,224,160,0)}}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 8px}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.counter .n{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
.counter .l{color:var(--muted);font-size:12px;margin-top:2px}
.counter.confirmed .n{color:var(--red)} .counter.needs .n{color:var(--amber)} .counter.rejected .n{color:var(--green)} .counter.cand .n{color:var(--blue)}
.flow{margin:22px 0 10px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.node{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:10px;padding:12px 14px;position:relative;transition:border-color .3s}
.node .st{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);display:flex;align-items:center;gap:6px}
.node .nm{font-weight:650;margin:3px 0 1px}
.node .dt{color:var(--muted);font-size:12.5px;min-height:1.2em}
.node .tm{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums;margin-top:5px}
.node.pending{opacity:.62}
.node.active{border-left-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.node.active .st{color:var(--amber)}
.node.done{border-left-color:var(--green)}
.node.done .st{color:var(--green)}
.node.failed{border-left-color:var(--red)} .node.failed .st{color:var(--red)}
.spin{width:10px;height:10px;border:2px solid var(--amber);border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{color:var(--green)} .pend{color:var(--faint)}
.children{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.child{flex:1;min-width:120px;background:var(--sunk);border:1px solid var(--line);border-left:3px solid var(--faint);border-radius:8px;padding:8px 10px;font-size:12.5px}
.child.active{border-left-color:var(--amber)} .child.done{border-left-color:var(--green)} .child.failed{border-left-color:var(--red)}
.child .cn{font-weight:600} .child .cs{color:var(--muted);font-size:11.5px;margin-top:2px}
.arrow{align-self:center;color:var(--faint);font-size:18px;padding:0 2px}
.stage-hunt{border-left-color:var(--blue)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:26px 0 8px}
.log{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 0;max-height:320px;overflow:auto;font-family:var(--mono);font-size:12.5px}
.log .e{display:flex;gap:10px;padding:5px 14px;border-top:1px solid var(--line)}
.log .e:first-child{border-top:0}
.log .t{color:var(--faint);white-space:nowrap}
.log .m{color:var(--text)}
.log .e.k-done .m{color:var(--green)} .log .e.k-start .m{color:var(--amber)} .log .e.k-find .m{color:var(--blue)}
.foot{color:var(--faint);font-size:11.5px;margin-top:16px}
</style></head>
<body><div class="wrap">
<header>
  <h1>OMGS pipeline</h1>
  <span class="sub" id="meta">loading…</span>
  <span class="live"><span class="dot" id="dot"></span><span id="upd">connecting</span></span>
</header>

<div class="counters">
  <div class="counter cand"><div class="n" id="c-cand">0</div><div class="l">candidates</div></div>
  <div class="counter confirmed"><div class="n" id="c-conf">0</div><div class="l">confirmed</div></div>
  <div class="counter needs"><div class="n" id="c-needs">0</div><div class="l">needs validation</div></div>
  <div class="counter rejected"><div class="n" id="c-rej">0</div><div class="l">rejected</div></div>
</div>

<div class="flow" id="flow"></div>

<h2>Activity</h2>
<div class="log" id="log"></div>
<p class="foot" id="foot"></p>
</div>
<script>
function fmtDur(ms){if(ms<0)ms=0;const s=Math.floor(ms/1000);if(s<60)return s+"s";const m=Math.floor(s/60);return m+"m "+(s%60)+"s";}
function now(){return Date.now();}
// Escape every value interpolated into innerHTML. The status file is written by
// the orchestrator, but its detail/label/log fields carry target-derived text
// (candidate titles, file paths), so treat all of it as untrusted.
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
const STATES={pending:1,active:1,done:1,failed:1};
function stateClass(s){return STATES[s]?s:"pending";}
function kindClass(k){return /^[a-z]+$/.test(k||"")?k:"";}
function icon(s){if(s==="active")return '<span class="spin"></span>';if(s==="done")return '<span class="tick">✓</span>';if(s==="failed")return '<span>✗</span>';return '<span class="pend">○</span>';}
function elapsed(st){if(!st.started_ms)return "";const end=st.ended_ms||now();let t=fmtDur(end-st.started_ms);return st.status==="active"?t+" elapsed":(st.ended_ms?t:"");}

function renderNode(st,extraClass){
  let kids="";
  if(st.children&&st.children.length){
    kids='<div class="children">'+st.children.map(c=>
      '<div class="child '+stateClass(c.status)+'"><div class="cn">'+icon(c.status)+' '+esc(c.label)+'</div><div class="cs">'+esc(c.detail||"")+'</div></div>').join("")+'</div>';
  }
  return '<div class="node '+stateClass(st.status)+' '+(extraClass||"")+'">'
    +'<div class="st">'+icon(st.status)+' '+esc(stateClass(st.status))+'</div>'
    +'<div class="nm">'+esc(st.label)+'</div>'
    +'<div class="dt">'+esc(st.detail||"")+'</div>'
    +'<div class="tm">'+esc(elapsed(st))+'</div>'+kids+'</div>';
}

function render(d){
  document.getElementById("meta").textContent=(d.target||"")+"  ·  "+(d.run||"");
  const c=d.counters||{};
  document.getElementById("c-cand").textContent=c.candidates??0;
  document.getElementById("c-conf").textContent=c.confirmed??0;
  document.getElementById("c-needs").textContent=c.needs_validation??0;
  document.getElementById("c-rej").textContent=c.rejected??0;
  const stages=d.stages||[];
  const flow=document.getElementById("flow");
  // Build rows: each stage on its own row with an arrow between, hunt stage highlighted.
  flow.innerHTML=stages.map((st,i)=>{
    const node=renderNode(st, st.id==="hunt"?"stage-hunt":"");
    const arrow=i<stages.length-1?'<div class="arrow">↓</div>':'';
    return '<div class="row">'+node+'</div>'+arrow;
  }).join("");
  const log=document.getElementById("log");
  log.innerHTML=(d.log||[]).slice().reverse().map(e=>
    '<div class="e k-'+kindClass(e.kind)+'"><span class="t">'+esc(e.ts||"")+'</span><span class="m">'+esc(e.m||"")+'</span></div>').join("")||'<div class="e"><span class="m">no events yet</span></div>';
  const upd=document.getElementById("upd"),dot=document.getElementById("dot");
  if(d.updated_ms){const age=now()-d.updated_ms;upd.textContent="updated "+fmtDur(age)+" ago";dot.classList.toggle("stale",age>120000);}
  document.getElementById("foot").textContent="Local dashboard. Polls pipeline-status.json every 2s. No external resources.";
}
async function tick(){
  try{const r=await fetch("pipeline-status.json?_="+now());const d=await r.json();render(d);
    document.getElementById("dot").classList.remove("stale");}
  catch(e){const upd=document.getElementById("upd");upd.textContent="waiting for status…";document.getElementById("dot").classList.add("stale");}
}
tick();setInterval(tick,2000);
</script></body></html>
